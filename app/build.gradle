apply plugin: 'com.android.application'

def localProps = new Properties()
localProps.load(new FileInputStream(rootProject.file("local.properties")))

android {
    compileSdk = 37

    buildFeatures {
        buildConfig = true
    }
    defaultConfig {
        applicationId "de.egi.geofence.geozone.plugin.tgm"
        minSdkVersion 23 // Android 7.0
        targetSdkVersion 37 // Android 17
        versionCode 119
        versionName "1.1.9"

        buildConfigField "int", "TD_API_ID", localProps["td_api_id"]
        buildConfigField "String", "TD_API_HASH", "\"${localProps['td_api_hash']}\""

    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            optimization.enable = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    packagingOptions {
        resources {
            excludes += ['META-INF/ASL2.0', 'META-INF/LICENSE', 'META-INF/NOTICE', 'META-INF/NOTICE.txt', 'META-INF/LICENSE.txt', 'META-INF/MANIFEST.MF']
        }
    }

    namespace 'de.egi.geofence.geozone.plugin.tgm'
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
dependencies {
    implementation project(':libtd')
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'log4j:log4j:1.2.17'
    implementation 'de.mindpipe.android:android-logging-log4j:1.0.3'
    implementation 'androidx.legacy:legacy-support-v13:1.0.0'
    implementation 'com.google.android.material:material:1.14.0'
}
// To avoid double classes
configurations.implementation {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}